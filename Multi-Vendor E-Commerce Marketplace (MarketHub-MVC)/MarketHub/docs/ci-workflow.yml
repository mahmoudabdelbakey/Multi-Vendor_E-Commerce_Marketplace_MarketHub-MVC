name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore "Multi-Vendor E-Commerce Marketplace (MarketHub-MVC)/MarketHub/MarketHub.sln"

    - name: Build
      run: dotnet build "Multi-Vendor E-Commerce Marketplace (MarketHub-MVC)/MarketHub/MarketHub.sln" --no-restore --configuration Release

    - name: Test
      run: dotnet test "Multi-Vendor E-Commerce Marketplace (MarketHub-MVC)/MarketHub/MarketHub.sln" --no-build --configuration Release --verbosity normal
